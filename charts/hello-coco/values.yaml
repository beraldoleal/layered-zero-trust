# Default values for hello-coco (SPIRE Delegated Identity Plugin)
#
# This chart deploys a CoCo peer-pod that receives an X.509-SVID via the
# Trustee SPIRE Delegated Identity Plugin (PR #1581).
# No SPIRE agent sidecar or spiffe-helper required.

# Sealed secret configuration for SPIRE SVID delivery via CDH
# CDH unseals kbs+spire:///x509-svid after TEE attestation,
# triggering the KBS SPIRE plugin to call the Delegated Identity API.
sealedSecret:
  # Name of the K8s Secret to create with the sealed SVID reference
  name: "spire-svid-sealed"
