# Sealed Secret for basic KBS attestation test.
#
# CDH (Confidential Data Hub) inside the TEE unseals this automatically:
#   1. CDH performs TEE hardware attestation with KBS
#   2. KBS validates the TEE evidence (SNP report, PCR, init-data)
#   3. KBS returns the sealed resource value
#   4. CDH writes the resource to the secret mount
#
# NOTE: Uses kbs+spire:// URI scheme for SPIRE Delegated Identity Plugin integration.
# CDH calls KBS with SPIRE plugin which:
#   1. Attests the peer pod TEE (hardware)
#   2. Calls SPIRE Delegated Identity API to get SVID for the workload
#   3. Returns the SVID to CDH for unsealing
# This requires SPIRE entries configured with trustee:attested:true selector.
#
# JWS format uses base64url encoding (RFC 7515) — no padding, + → -, / → _
{{- define "hello-coco.sealedRef" -}}
{{- $json := printf `{"version":"0.1.0","type":"vault","name":"kbs+spire:///%s","provider":"kbs","provider_settings":{},"annotations":{}}` . -}}
sealed.fakejwsheader.{{ $json | b64enc | replace "+" "-" | replace "/" "_" | trimSuffix "=" | trimSuffix "=" }}.fakesignature
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.sealedSecret.name }}
  namespace: zero-trust-workload-identity-manager
type: Opaque
stringData:
  attestation-result: {{ include "hello-coco.sealedRef" "x509-svid" | quote }}
