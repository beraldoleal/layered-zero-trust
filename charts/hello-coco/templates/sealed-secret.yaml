# Sealed Secret for SPIRE Delegated Identity Plugin SVID delivery.
#
# CDH (Confidential Data Hub) inside the TEE unseals this automatically:
#   1. CDH performs TEE hardware attestation with KBS
#   2. KBS validates the TEE evidence (SNP report, PCR, init-data)
#   3. KBS SPIRE plugin calls the SPIRE Agent Delegated Identity API
#   4. SPIRE returns an X.509-SVID for the CoCo workload
#   5. CDH decrypts and writes the SVID JSON to the secret mount
#
# The sealed reference uses the kbs+spire URI scheme to route to the SPIRE plugin.
# Format: kbs+spire:///<resource-path>
#   x509-svid  → SpireSvidResponse { spiffe_id, cert_chain: [[DER]], private_key: [DER] }
#
# JWS format uses base64url encoding (RFC 7515) — no padding, + → -, / → _
{{- define "hello-coco.sealedRef" -}}
{{- $json := printf `{"version":"0.1.0","type":"vault","name":"kbs+spire:///%s","provider":"kbs","provider_settings":{},"annotations":{}}` . -}}
sealed.fakejwsheader.{{ $json | b64enc | replace "+" "-" | replace "/" "_" | trimSuffix "=" | trimSuffix "=" }}.fakesignature
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.sealedSecret.name }}
  namespace: zero-trust-workload-identity-manager
type: Opaque
stringData:
  x509-svid: {{ include "hello-coco.sealedRef" "x509-svid" | quote }}
