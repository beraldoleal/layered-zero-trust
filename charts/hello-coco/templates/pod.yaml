# CoCo workload testing basic KBS attestation.
#
# Flow:
#   1. Pod starts inside a SEV-SNP TEE (kata-remote / peer-pod)
#   2. CDH inside the TEE attests to KBS (TEE hardware attestation)
#   3. CDH unseals the K8s secret: fetches kbs:///default/passphrase/passphrase from KBS
#   4. CDH writes the resource value to the sealed secret mount
#   5. test-workload verifies the value was retrieved
#
# Trust chain: Hardware TEE → CDH → KBS attestation → resource delivery
#
# NOTE: This tests basic attestation with standard kbs:/// URI.
# Once confirmed, upgrade sealed secret to kbs+spire:///x509-svid (requires
# guest-components with kbs+spire:// support, OSC 1.14+ or custom build).
apiVersion: v1
kind: Pod
metadata:
  name: spire-agent-cc
  namespace: zero-trust-workload-identity-manager
  labels:
    app: spire-agent-cc
spec:
  runtimeClassName: kata-remote
  serviceAccountName: spire-agent

  volumes:
  - name: attestation-sealed
    secret:
      secretName: {{ .Values.sealedSecret.name }}
  - name: result
    emptyDir: {}

  containers:
  - name: test-workload
    image: registry.redhat.io/ubi9/ubi-minimal:latest
    command: ["/bin/sh", "-c"]
    args:
      - |
        echo "=== CoCo Attestation Test ==="
        echo "Trust chain: Hardware TEE → CDH → KBS → Resource delivery"
        echo ""

        ls -la /attestation/ 2>/dev/null || echo "No attestation dir"

        if [ -f /attestation/attestation-result ]; then
          echo "SUCCESS: KBS attestation worked! Retrieved sealed resource:"
          cat /attestation/attestation-result
          echo ""
          echo "Peer pod VM attestation to KBS confirmed."
        else
          echo "PENDING: Waiting for CDH to unseal attestation result..."
          echo "Files in /attestation:"
          ls -la /attestation/ 2>/dev/null
        fi

        echo "=== Sleeping for manual inspection ==="
        sleep 3600
    volumeMounts:
    - name: attestation-sealed
      mountPath: /attestation
      readOnly: true
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: false
      seccompProfile:
        type: RuntimeDefault
