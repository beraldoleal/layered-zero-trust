---
# Configure SPIRE Agent to expose the Delegated Identity API admin socket
# and authorize KBS as a trusted delegate.
#
# The SPIRE Delegated Identity API allows KBS to request SVIDs on behalf of
# attested CoCo workloads. This requires:
#   1. The admin socket to be enabled in the SpireAgent config.
#   2. KBS's SPIFFE-ID listed as an authorized_delegate.
#
# The ZTWIM operator reconciles the SpireAgent DaemonSet. To prevent the operator
# from reverting our admin socket config, we enable CREATE_ONLY_MODE=true on the
# operator *after* patching. This is a global kill switch — temporarily disable it
# when making intentional ZTWIM changes.
#
# After this playbook runs, the trustee deployment (which mounts the admin socket
# via hostPath at /run/spire/agent/sockets/csi.spiffe.io/admin) will be able to
# call the Delegated Identity API.

- name: Configure SPIRE Agent admin socket for Delegated Identity API
  become: false
  connection: local
  hosts: localhost
  gather_facts: false
  vars:
    spire_namespace: "zero-trust-workload-identity-manager"
    agent_configmap_name: "spire-agent"
    agent_daemonset_name: "spire-agent"
    # The SPIFFE-ID of the KBS workload entry (set by register-spire-entries.yaml)
    # Format: spiffe://<trust_domain>/ns/trustee-operator-system/sa/trustee-sa
    kbs_spiffe_id_prefix: "spiffe://"
    admin_socket_dir: "/run/spire/admin"
    admin_socket_path: "{{ admin_socket_dir }}/admin.sock"  # maps to host /run/spire/admin-socket/admin.sock

  tasks:
    - name: Get ZeroTrustWorkloadIdentityManager CR to determine trust domain
      kubernetes.core.k8s_info:
        api_version: operator.openshift.io/v1alpha1
        kind: ZeroTrustWorkloadIdentityManager
        name: cluster
        namespace: "{{ spire_namespace }}"
      register: ztwim_cr
      retries: 30
      delay: 10
      until: ztwim_cr.resources | length > 0

    - name: Extract trust domain from ZeroTrustWorkloadIdentityManager CR
      ansible.builtin.set_fact:
        trust_domain: "{{ ztwim_cr.resources[0].spec.trustDomain }}"
        cluster_name: "{{ ztwim_cr.resources[0].spec.clusterName }}"

    - name: Display trust domain and cluster name
      ansible.builtin.debug:
        msg: "Trust domain: {{ trust_domain }}, Cluster: {{ cluster_name }}"

    - name: Set KBS SPIFFE-ID (used as authorized_delegate)
      ansible.builtin.set_fact:
        kbs_spiffe_id: "spiffe://{{ trust_domain }}/ns/trustee-operator-system/sa/trustee-sa"

    - name: Wait for SpireAgent ConfigMap
      kubernetes.core.k8s_info:
        kind: ConfigMap
        namespace: "{{ spire_namespace }}"
        name: "{{ agent_configmap_name }}"
      register: agent_configmap
      retries: 60
      delay: 5
      until: agent_configmap.resources | length > 0

    - name: Parse agent configuration
      ansible.builtin.set_fact:
        agent_conf: "{{ agent_configmap.resources[0].data['agent.conf'] | from_json }}"

    - name: Check if admin socket already configured
      ansible.builtin.set_fact:
        admin_already_configured: >-
          {{ (agent_conf.plugins.KeyManager | default([]) |
              selectattr('admin', 'defined') | list | length > 0) or
             (agent_conf.admin_apis is defined) or
             (agent_conf.agent.admin_socket_path is defined) }}

    - name: Display current configuration status
      ansible.builtin.debug:
        msg: "Admin socket already configured: {{ admin_already_configured }}"

    - name: Add admin socket and authorized_delegate to agent config
      when: not admin_already_configured
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ agent_configmap_name }}"
            namespace: "{{ spire_namespace }}"
          data:
            agent.conf: |
              {{ agent_conf | combine({
                'agent': agent_conf.agent | combine({
                  'admin_socket_path': admin_socket_path,
                  'authorized_delegates': [kbs_spiffe_id]
                })
              }) | to_json(indent=2) }}

    - name: Wait for SPIRE Agent DaemonSet pods to be Ready
      kubernetes.core.k8s_info:
        kind: DaemonSet
        namespace: "{{ spire_namespace }}"
        name: "{{ agent_daemonset_name }}"
      register: agent_ds
      retries: 30
      delay: 10
      until: >-
        agent_ds.resources | length > 0 and
        agent_ds.resources[0].status.numberReady | default(0) ==
        agent_ds.resources[0].status.desiredNumberScheduled | default(1)

    - name: Add admin socket hostPath volume to SPIRE Agent DaemonSet
      when: not admin_already_configured
      kubernetes.core.k8s_json_patch:
        api_version: apps/v1
        kind: DaemonSet
        namespace: "{{ spire_namespace }}"
        name: "{{ agent_daemonset_name }}"
        patch:
          - op: add
            path: /spec/template/spec/volumes/-
            value:
              name: spire-agent-admin-socket-dir
              hostPath:
                path: "{{ admin_socket_dir }}"
                type: DirectoryOrCreate
          - op: add
            path: /spec/template/spec/containers/0/volumeMounts/-
            value:
              name: spire-agent-admin-socket-dir
              mountPath: "{{ admin_socket_dir }}"

    - name: Restart SPIRE Agent DaemonSet to pick up new config and volume
      when: not admin_already_configured
      kubernetes.core.k8s_json_patch:
        api_version: apps/v1
        kind: DaemonSet
        namespace: "{{ spire_namespace }}"
        name: "{{ agent_daemonset_name }}"
        patch:
          - op: add
            path: /spec/template/metadata/annotations
            value:
              kubectl.kubernetes.io/restartedAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Enable CREATE_ONLY_MODE on ZTWIM operator to prevent revert
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: openshift-zero-trust-workload-identity-manager
            namespace: zero-trust-workload-identity-manager
          spec:
            config:
              env:
                - name: CREATE_ONLY_MODE
                  value: "true"

    - name: Wait for ZTWIM operator to restart with CREATE_ONLY_MODE
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ spire_namespace }}"
        label_selectors:
          - "name=zero-trust-workload-identity-manager"
      register: ztwim_pods
      retries: 30
      delay: 10
      until: >-
        ztwim_pods.resources | length > 0 and
        (ztwim_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length > 0)

    - name: Remove kbsResourcePolicyConfigMapName from KbsConfig
      kubernetes.core.k8s_json_patch:
        api_version: confidentialcontainers.org/v1alpha1
        kind: KbsConfig
        namespace: trustee-operator-system
        name: kbsconfig
        patch:
          - op: remove
            path: /spec/kbsResourcePolicyConfigMapName
      ignore_errors: true

    - name: Get a SPIRE agent pod name for verification
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ spire_namespace }}"
        label_selectors:
          - "app.kubernetes.io/name=spire-agent"
      register: spire_agent_pods

    - name: Verify admin socket directory is accessible
      when: spire_agent_pods.resources | length > 0
      kubernetes.core.k8s_exec:
        namespace: "{{ spire_namespace }}"
        pod: "{{ spire_agent_pods.resources[0].metadata.name }}"
        command:
          - "ls"
          - "-la"
          - "{{ admin_socket_dir }}"
      register: socket_check
      ignore_errors: true

    - name: Display socket check result
      ansible.builtin.debug:
        msg: "{{ socket_check.stdout | default('Could not check socket - pod exec may be restricted') }}"

    - name: Wait for KBS deployment to exist
      kubernetes.core.k8s_info:
        kind: Deployment
        namespace: trustee-operator-system
        name: trustee-deployment
      register: kbs_deployment
      retries: 30
      delay: 10
      until: kbs_deployment.resources | length > 0

    - name: Check if KBS deployment already has admin socket volume
      ansible.builtin.set_fact:
        kbs_has_admin_volume: >-
          {{ kbs_deployment.resources[0].spec.template.spec.volumes |
             default([]) |
             selectattr('name', 'equalto', 'spire-agent-admin-socket') |
             list | length > 0 }}

    - name: Patch KBS deployment with SPIRE admin socket volume
      when: not kbs_has_admin_volume
      kubernetes.core.k8s_json_patch:
        api_version: apps/v1
        kind: Deployment
        namespace: trustee-operator-system
        name: trustee-deployment
        patch:
          - op: add
            path: /spec/template/spec/volumes/-
            value:
              name: spire-agent-admin-socket
              hostPath:
                path: "/run/spire/admin-socket"
                type: Directory
          - op: add
            path: /spec/template/spec/containers/0/volumeMounts/-
            value:
              name: spire-agent-admin-socket
              mountPath: "/run/spire/sockets"
              readOnly: true
